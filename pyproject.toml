[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-affix-relevance"
version = "0.1.0"
description = "Build-relevance annotations for Grim Dawn affixes"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.10,<7",
]

[project.scripts]
grim-gleaner = "gd_affix_relevance.cli:main"
grim-gleaner-ui = "gd_affix_relevance.ui.app:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
