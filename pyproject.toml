[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-affix-relevance"
dynamic = ["version"]
description = "Build-relevance annotations for Grim Dawn affixes"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6==6.11.1",
]

[project.scripts]
grim-gleaner = "gd_affix_relevance.cli:main"
grim-gleaner-ui = "gd_affix_relevance.ui.app:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]
release = [
    "Nuitka==4.1.3",
]

[tool.setuptools.dynamic]
# Single source of truth: src/gd_affix_relevance/__init__.py
version = { attr = "gd_affix_relevance.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
